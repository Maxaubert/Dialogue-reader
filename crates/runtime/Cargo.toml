[package]
name = "dr-runtime"
version.workspace = true
edition = "2024"
description = "DialogReader runtime without UI: profiles, windows, capture, reading, keys, speech"

[lib]
name = "dr_runtime"
path = "src/lib.rs"

[dependencies]
dr-core = { path = "../core" }
dr-tts = { path = "../tts" }
# The OCR the reader thread reads with (M3b).
dr-ocr = { path = "../ocr" }
# Audio out for speech (speech.rs). Playback only: no decoders, the PCM comes from dr-tts.
rodio = { version = "=0.21.1", default-features = false, features = ["playback"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "=2.0.1"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "=3.27.0"
# Arena scenes as frames for the headless runtime test (tests/reading.rs).
arena = { path = "../arena" }
