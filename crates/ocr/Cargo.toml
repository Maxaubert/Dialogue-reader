[package]
name = "dr-ocr"
version.workspace = true
edition = "2024"
description = "DialogReader OCR: the Windows built-in OCR engine (Windows.Media.Ocr) behind dr_core::Ocr"

[lib]
name = "dr_ocr"
path = "src/lib.rs"

[dependencies]
dr-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
