[package]
name = "recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive"] }
png = "0.18.1"
qoi = "0.4.1"
serde_json = "1.0.154"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Performance", "Win32_UI_HiDpi", "Win32_System_Console"] }
windows-capture = "2.0.1"
